trigger:
  branches:
    include:
      - main
      - release/sonarqube

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - script: dotnet restore
    displayName: 'Restore Dependencies'

  - script: dotnet build -c Release --no-restore
    displayName: 'Build Application'

  - script: echo "Version = 1.0.$(Build.BuildId)"
    displayName: 'Print Version'

  - script: dotnet publish -c Release --no-restore -o $(Build.ArtifactStagingDirectory)/app
    displayName: 'Publish Application'

  - task: UniversalPackages@0
    displayName: 'Upload to Azure Artifacts'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      command: 'publish'
      publishDirectory: '$(Build.ArtifactStagingDirectory)/app'
      feedsToUsePublish: 'internal'
      vstsFeedPublish: 'nitzan-project-1/helloworld-feed'
      vstsFeedPackagePublish: 'helloworld'
      versionOption: 'custom'
      versionPublish: '1.0.$(Build.BuildId)'

  - script: echo "Running Release Pipeline"
    displayName: 'Test Release Condition'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/release/sonarqube'))